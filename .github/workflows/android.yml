name: ZXCMUSS-apk
on:
  push:
    branches: [ main ]
    paths: [ 'ZXCMUSS-project.zip' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -oq ZXCMUSS-project.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZXCMUSS-apk
          path: src/app/build/outputs/apk/release/*.apk
